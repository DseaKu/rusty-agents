# Agent settings. Set AGENTS_CONFIG to use a different file.

# The provider entry to use. To switch, change this one line.
active: claude

# Each entry needs a `type` and a `model`. Optional fields:
#   base_url     - API address (each type has a default)
#   api_key_env  - environment variable that holds the token (set it in your shell or .env)
#   max_tokens   - upper limit for each reply (default 4096)
#   effort       - how much the model thinks before it replies (default: the model's own default)
#                  anthropic: low | medium | high | xhigh | max
#                  openai/ollama: sent as reasoning_effort (only reasoning models accept it)
#
# Types: ollama (local, no token), openai (any OpenAI-compatible API), anthropic (Claude).
providers:
  local:
    type: ollama
    model: qwen3:1.7b

  claude:
    type: anthropic
    model: claude-haiku-5-5
    effort: medium
    # model: claude-sonnet-5-5

  openai:
    type: openai
    model: gpt-4o-mini

  openrouter:
    type: openai
    model: meta-llama/llama-3.3-70b-instruct
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
